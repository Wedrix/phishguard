name: phishguard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: phishguard
      POSTGRES_USER: phishguard
      POSTGRES_PASSWORD: phishguard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phishguard"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: ["migrate"]
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://phishguard:phishguard@postgres:5432/phishguard
      PHISHGUARD_HMAC_KEY: local-development-hmac-key
      PHISHGUARD_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      COOKIE_SECURE: "false"
      DEV_AUTH_ENABLED: "true"
      FETCHER_URL: http://fetcher:8081
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: ["web"]
    environment: *app-env
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      fetcher:
        condition: service_healthy

  jobs:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: ["jobs"]
    environment:
      <<: *app-env
      JOB_CONCURRENCY: "2"
    depends_on:
      migrate:
        condition: service_completed_successfully
      fetcher:
        condition: service_healthy

  fetcher:
    build:
      context: .
      dockerfile: Dockerfile.fetcher
    environment:
      FETCHER_DEV_INSECURE: "true"
      FETCHER_PORT: "8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=2)"]
      interval: 3s
      timeout: 2s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres-data:

