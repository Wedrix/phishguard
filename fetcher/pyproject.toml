[project]
name = "phishguard-fetcher"
version = "0.1.0"
description = "Credentialless, SSRF-hardened evidence fetcher for PhishGuard"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10,<4",
  "dnspython>=2.7,<3",
  "fastapi>=0.115,<1",
  "idna>=3.10,<4",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[project.scripts]
phishguard-fetcher = "phishguard_fetcher.main:run"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phishguard_fetcher"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
