apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: jobs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jobs
    spec:
      serviceAccountName: jobs
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: APP_IMAGE
          command: ["/bin/sh", "-ec"]
          args:
            - |
              export PHISHGUARD_HMAC_KEY="$(cat /var/run/phishguard/jobs/app-hmac-key)"
              export WEB_RISK_API_KEY="$(cat /var/run/phishguard/jobs/web-risk-api-key)"
              export DATABASE_URL="$(python -c 'import os, urllib.parse; print("postgresql+psycopg://" + urllib.parse.quote(os.environ["DB_IAM_USER"], safe="") + "@127.0.0.1:5432/" + os.environ["DB_NAME"])')"
              exec python -m phishguard.cli jobs
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_IAM_USER
              value: phishguard-jobs@__PROJECT_ID__.iam
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: jobs-secrets
              mountPath: /var/run/phishguard/jobs
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          args: ["--auto-iam-authn", "--private-ip", "--structured-logs", "--port=5432", "__CLOUD_SQL_CONNECTION_NAME__"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: jobs-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: jobs-secrets
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
