apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      serviceAccountName: web
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: APP_IMAGE
          command: ["/bin/sh", "-ec"]
          args:
            - |
              export PHISHGUARD_HMAC_KEY="$(cat /var/run/phishguard/web/app-hmac-key)"
              export DATABASE_URL="$(python -c 'import os, urllib.parse; print("postgresql+psycopg://" + urllib.parse.quote(os.environ["DB_IAM_USER"], safe="") + "@127.0.0.1:5432/" + os.environ["DB_NAME"])')"
              exec python -m phishguard.cli web
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_IAM_USER
              value: phishguard-web@__PROJECT_ID__.iam
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: web-secrets
              mountPath: /var/run/phishguard/web
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          args:
            - --auto-iam-authn
            - --private-ip
            - --structured-logs
            - --port=5432
            - __CLOUD_SQL_CONNECTION_NAME__
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: web-secrets
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: web-secrets
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
