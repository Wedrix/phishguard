apiVersion: batch/v1
kind: CronJob
metadata:
  name: evaluate
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: evaluate
          annotations:
            gke-gcsfuse/volumes: "true"
        spec:
          restartPolicy: Never
          serviceAccountName: jobs
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: evaluate
              image: APP_IMAGE
              envFrom:
                - configMapRef:
                    name: app-config
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  output="/artifacts/research/outputs/evaluation-$(date -u +%Y%m%dT%H%M%SZ)"
                  exec python -m phishguard.cli evaluate /artifacts/research/input.csv "$output"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 1
                  memory: 2Gi
                limits:
                  memory: 4Gi
              volumeMounts:
                - name: artifacts
                  mountPath: /artifacts
          volumes:
            - name: artifacts
              csi:
                driver: gcsfuse.csi.storage.gke.io
                readOnly: false
                volumeAttributes:
                  bucketName: RESEARCH_BUCKET
                  mountOptions: implicit-dirs
