apiVersion: apps/v1
kind: Deployment
metadata:
  name: fetcher
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fetcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fetcher
    spec:
      serviceAccountName: fetcher
      automountServiceAccountToken: false
      runtimeClassName: gvisor
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fetcher
          image: FETCHER_IMAGE
          env:
            - name: FETCHER_PORT
              value: "8443"
            - name: FETCHER_TLS_KEY
              value: /var/run/phishguard/fetcher/tls.key
            - name: FETCHER_TLS_CERT
              value: /var/run/phishguard/fetcher/tls.crt
            - name: FETCHER_CLIENT_CA
              value: /var/run/phishguard/fetcher/ca.crt
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: mtls
              mountPath: /var/run/phishguard/fetcher
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: mtls
          secret:
            secretName: fetcher-mtls
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fetcher
spec:
  selector:
    app.kubernetes.io/name: fetcher
  ports:
    - name: https
      port: 8443
      targetPort: https
